<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>解約手続き｜心占SHINSO</title>
<style>
body{background:#0a0520;color:#fff;font-family:sans-serif;text-align:center;padding:40px 20px;}
h1{color:#f2d78c;font-size:24px;margin-bottom:16px;}
p{color:rgba(255,255,255,0.8);line-height:1.8;margin-bottom:24px;}
input{width:100%;max-width:320px;padding:14px;border-radius:8px;border:1px solid #c9a227;background:#1a0840;color:#fff;font-size:16px;margin-bottom:16px;}
button{background:#c9a227;color:#000;border:none;padding:14px 32px;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;}
#msg{margin-top:16px;color:#f88;}
</style>
</head>
<body>
<h1>解約手続き</h1>
<p>ご登録時にお使いになったメールアドレスを入力してください。<br>お手続きページへご案内します。</p>
<input type="email" id="email" placeholder="メールアドレス">
<br>
<button onclick="goToPortal()">解約ページへ進む</button>
<p id="msg"></p>
<script>
async function goToPortal(){
  const email = document.getElementById('email').value;
  const msg = document.getElementById('msg');
  if(!email){ msg.textContent = 'メールアドレスを入力してください。'; return; }
  msg.textContent = '確認中...';
  try{
    const res = await fetch('/api/create-portal', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email})
    });
    const data = await res.json();
    if(data.url){ location.href = data.url; }
    else{ msg.textContent = data.error || 'エラーが発生しました。'; }
  }catch(e){
    msg.textContent = '通信エラーが発生しました。';
  }
}
</script>
</body>
</html>
